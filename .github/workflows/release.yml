name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The release may already exist if it was drafted on GitHub, which
        # also creates the tag; then only the files are added.
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "Sheaf $GITHUB_REF_NAME" --generate-notes \
              $(case "$GITHUB_REF_NAME" in *-*) echo --prerelease;; esac)
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber
      - name: Update the Homebrew formula
        # Stable releases only. The formula lives in this repository, so
        # `brew tap sensahin/sheaf https://github.com/sensahin/sheaf` works
        # without a separate tap repository.
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          mkdir -p Formula
          scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/checksums.txt > Formula/sheaf.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git add Formula/sheaf.rb
          git diff --cached --quiet || git commit -m "Update the Homebrew formula to $GITHUB_REF_NAME"
          git push origin main

  desktop:
    # The webview needs native code, so each platform builds on its own
    # runner, after the release above exists.
    needs: release
    strategy:
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: scripts/build-desktop.sh "$GITHUB_REF_NAME"
      - name: Upload the desktop app
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
